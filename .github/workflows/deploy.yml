name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build
        run: |
          mkdir dist
          cp -r index.html assets og-image.png favicon.* favicon-32.png apple-touch-icon.png .nojekyll dist/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Wait for artifact
        run: sleep 30
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Retry wait
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - name: Retry deploy
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
